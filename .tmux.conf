# tmux 3.0a
#-------------------------------------------------------#
# Pane colours — matched to Ghostty default theme
#-------------------------------------------------------#
set -g window-style 'fg=#c5c8c6,bg=#1d1f21'       # inactive (slightly darker than Ghostty bg)
set -g window-active-style 'fg=#ffffff,bg=#282c34'  # active (matches Ghostty background)

# Pane border
set -g pane-border-style 'fg=#666666,bg=#1d1f21'
set -g pane-active-border-style 'fg=#81a2be,bg=#282c34'

# Status bar
set -g status-style 'fg=#c5c8c6,bg=#1d1f21'
set -g status-left-style 'fg=#282c34,bg=#81a2be,bold'
set -g status-right-style 'fg=#c5c8c6,bg=#1d1f21'
set -g window-status-current-style 'fg=#282c34,bg=#b5bd68,bold'
set -g window-status-style 'fg=#c5c8c6,bg=#1d1f21'
set -g message-style 'fg=#ffffff,bg=#282c34'

#-------------------------------------------------------#
# set -g default-terminal "screen-256color"

# Allow scrolling with mouse
set -g mouse on

# Binds

## Use current path when creating a new pane or window
bind '%' split-window -h -c '#{pane_current_path}'  # Split panes horizontal
bind '"' split-window -v -c '#{pane_current_path}'  # Split panes vertically
bind c new-window -c '#{pane_current_path}' # Create new window

# Packages


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# To load the config file do 'tmux source ~/.tmux.conf'
# See https://github.com/tmux-plugins/tpm for installation instructions
run '~/.tmux/plugins/tpm/tpm'
